name: Release

# Push a tag such as v0.1.0 to build static linux/amd64 and linux/arm64
# binaries and publish them, with checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: Check version injection
        run: |
          tar -xzf "dist/pomobar-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pomobar-${GITHUB_REF_NAME}-linux-amd64/pomobar" -version | tee /dev/stderr | grep -qx "pomobar ${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
